apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: timer-tls
  namespace: default
spec:
  secretName: timer-tls
  dnsNames:
  - timer.tahmidur-chow.com
  issuerRef:
    name: letsencrypt-dns-cloudflare
    kind: ClusterIssuer

